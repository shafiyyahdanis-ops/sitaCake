<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Coquette Cake</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div class="banner"></div>
        <div class="profile">
          <img
            src="https://i.pinimg.com/736x/cf/0a/bc/cf0abc48b74c4f67953b1165a7f50656.jpg"
            alt="logo"
            class="logo"
          />
          <h1>Sita Cake &amp; Spaghetti</h1>
          <p class="bio">Welcome back, sweetie</p>
        </div>
      </div>

      <div class="login">
        <h1>Login</h1>
        <form class="login-form" novalidate>
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input is-invalid"
              placeholder="you@example.com"
              aria-describedby="email-error"
              aria-invalid="true"
            />
            <p id="email-error" class="form-error">Email is required</p>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input is-invalid"
              placeholder="Enter your password"
              aria-describedby="password-error"
              aria-invalid="true"
            />
            <p id="password-error" class="form-error">Password is required</p>
          </div>

          <button type="submit" class="btn-buy">Login</button>
        </form>
      </div>

      <button id="cek">Cek Data Login</button>
      <div id="session-wrapper">
        <p id="email-session"></p>
        <p id="password-session"></p>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
